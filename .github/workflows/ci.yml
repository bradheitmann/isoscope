name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-web:
    name: original-web (typecheck, test, build)
    # Persistent runners only execute trusted main pushes, never PR code.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","isoscope"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: original-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9 # must equal package.json packageManager (asserted by original-web/tests/ci-bun-pin.test.ts)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: original-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bun run qa:static
      - run: bun run check:chunks

  root:
    name: root (typecheck, test, build)
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","isoscope"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # the root job never reads original-web/public/media (~550 MB); skip it
          sparse-checkout: |
            /*
            !/original-web/public/media/
          sparse-checkout-cone-mode: false
          lfs: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9 # must equal package.json packageManager (asserted by original-web/tests/ci-bun-pin.test.ts)
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:self
      - run: bun run build:odin
      - run: bun run build:lumbr
