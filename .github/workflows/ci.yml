name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-web:
    name: original-web (typecheck, test, build)
    # self-hosted: GitHub-hosted minutes are billing-blocked; mbp-isoscope-1 is
    # registered to this repo with the `isoscope` label and started manually by
    # the owner. Jobs queue (they never fail on billing) until it is online.
    runs-on: [self-hosted, isoscope]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: original-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9 # must equal package.json packageManager (asserted by original-web/tests/ci-bun-pin.test.ts)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: original-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # OPT-IN Running Man admission candidate: wraps ONLY the existing test
      # command when the runner provisions RUNNING_MAN_BIN + RUNNING_MAN_URL
      # (coordinator deployment is a separate, owner-authorized step). Without
      # them the step runs exactly as before. Spec binds HEAD/base, Node/Bun
      # versions, worker image, lockfile and this workflow's digest; fast class,
      # success reuse on (tests are pure - no artifacts). Specs/receipts stay in
      # runner.temp, never in the checkout.
      - name: Workspace tests (through Running Man when provisioned)
        env:
          RUNNING_MAN_BIN: ~/.local/share/running-man/v0.1.1/running-man
          RM_SPEC: ${{ runner.temp }}/running-man-web-test.json
          RM_RECEIPT: ${{ runner.temp }}/running-man-web-test.receipt.json
          RUNNING_MAN_TOKEN: ${{ secrets.RUNNING_MAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RUNNING_MAN_URL:-}" ] || [ ! -x "$RUNNING_MAN_BIN" ]; then
            echo "Running Man not provisioned; running tests unmanaged"
            npm --prefix original-web test
            exit 0
          fi
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          base=${base:-$(git merge-base origin/main HEAD 2>/dev/null || echo "$GITHUB_SHA")}
          "$RUNNING_MAN_BIN" prepare --project "$GITHUB_REPOSITORY" --scope test \
            --base "$base" --pool mbp-guest --platform macos-arm64 \
            --toolchain "node24-bun1.3.9" --key "worker-image=${RUNNING_MAN_IMAGE_ID:-mbp-isoscope-1}" \
            --class fast --cpu 2 --memory-mb 2048 --timeout-seconds 1200 --reuse-success \
            --input original-web/package-lock.json --input original-web/package.json \
            --input .github/workflows/ci.yml \
            --output "$RM_SPEC" -- npm --prefix original-web test
          "$RUNNING_MAN_BIN" run --spec "$RM_SPEC" --receipt "$RM_RECEIPT"
      - run: npm run build
      - run: bun run qa:static
      - run: bun run check:chunks

  root:
    name: root (typecheck, test, build)
    runs-on: [self-hosted, isoscope]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # the root job never reads original-web/public/media (~550 MB); skip it
          sparse-checkout: |
            /*
            !/original-web/public/media/
          sparse-checkout-cone-mode: false
          lfs: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9 # must equal package.json packageManager (asserted by original-web/tests/ci-bun-pin.test.ts)
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:self
      - run: bun run build:odin
      - run: bun run build:lumbr
