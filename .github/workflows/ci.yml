name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-web:
    name: original-web (typecheck, test, build)
    # runner choice is a repo variable: set USE_SELF_HOSTED=true (repo Settings >
    # Variables) to route to the owner's mbp-isoscope-1; forks and the public repo
    # get GitHub-hosted ubuntu-latest (free on public repos) with no edits needed.
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","isoscope"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: original-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9 # must equal package.json packageManager (asserted by original-web/tests/ci-bun-pin.test.ts)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: original-web/package-lock.json
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: npm ci
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: npm run typecheck
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: npm test
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: npm run build
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun run qa:static
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun run check:chunks

      - name: original-web through shared Running Man admission
        if: vars.RUNNING_MAN_ENABLED == 'true'
        working-directory: ${{ github.workspace }}
        env:
          RUNNING_MAN_BIN: ${{ vars.RUNNING_MAN_BIN }}
          RUNNING_MAN_URL: ${{ vars.RUNNING_MAN_URL }}
          RUNNING_MAN_TOKEN: ${{ secrets.RUNNING_MAN_TOKEN }}
          RM_IMAGE: ${{ vars.RUNNING_MAN_IMAGE_ID }}
          RM_INSTANCE: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
        run: |
          set -euo pipefail
          : "${RUNNING_MAN_BIN:?pinned v0.1.1 binary required}"
          : "${RUNNING_MAN_URL:?approved common coordinator required}"
          : "${RM_IMAGE:?immutable worker-image identity required}"
          test "$("$RUNNING_MAN_BIN" --version)" = 'running-man 0.1.1'
          spec="$RUNNER_TEMP/running-man-original-web.json"
          "$RUNNING_MAN_BIN" prepare --project "$GITHUB_REPOSITORY" --scope "original-web" \
            --base "$(git rev-parse HEAD)" --pool mbp-guest --platform macos-arm64 \
            --toolchain "node=$(node --version);bun=$(bun --version);npm=$(npm --version)" \
            --key "worker-image=$RM_IMAGE" --key "workspace-instance=$RM_INSTANCE" \
            --class fast --cpu 2 --memory-mb 2048 --timeout-seconds 1050 --env CI=true \
            --input .github/workflows/ci.yml --input original-web/package-lock.json --input original-web/package.json --input package.json \
            --output "$spec" -- sh -eu -c 'cd original-web; npm ci; npm run typecheck; npm test; npm run build; bun run qa:static; bun run check:chunks'
          "$RUNNING_MAN_BIN" run --spec "$spec" --queue-timeout-seconds 90 \
            --receipt "$RUNNER_TEMP/running-man-original-web.receipt.json"

  root:
    name: root (typecheck, test, build)
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","isoscope"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # the root job never reads original-web/public/media (~550 MB); skip it
          sparse-checkout: |
            /*
            !/original-web/public/media/
          sparse-checkout-cone-mode: false
          lfs: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9 # must equal package.json packageManager (asserted by original-web/tests/ci-bun-pin.test.ts)
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun install --frozen-lockfile
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun run typecheck
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun run test
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun run build:self
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun run build:odin
      - if: vars.RUNNING_MAN_ENABLED != 'true'
        run: bun run build:lumbr

      - name: root through shared Running Man admission
        if: vars.RUNNING_MAN_ENABLED == 'true'
        working-directory: ${{ github.workspace }}
        env:
          RUNNING_MAN_BIN: ${{ vars.RUNNING_MAN_BIN }}
          RUNNING_MAN_URL: ${{ vars.RUNNING_MAN_URL }}
          RUNNING_MAN_TOKEN: ${{ secrets.RUNNING_MAN_TOKEN }}
          RM_IMAGE: ${{ vars.RUNNING_MAN_IMAGE_ID }}
          RM_INSTANCE: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
        run: |
          set -euo pipefail
          : "${RUNNING_MAN_BIN:?pinned v0.1.1 binary required}"
          : "${RUNNING_MAN_URL:?approved common coordinator required}"
          : "${RM_IMAGE:?immutable worker-image identity required}"
          test "$("$RUNNING_MAN_BIN" --version)" = 'running-man 0.1.1'
          spec="$RUNNER_TEMP/running-man-root.json"
          "$RUNNING_MAN_BIN" prepare --project "$GITHUB_REPOSITORY" --scope "root" \
            --base "$(git rev-parse HEAD)" --pool mbp-guest --platform macos-arm64 \
            --toolchain "bun=$(bun --version)" \
            --key "worker-image=$RM_IMAGE" --key "workspace-instance=$RM_INSTANCE" \
            --class fast --cpu 2 --memory-mb 2048 --timeout-seconds 1050 --env CI=true \
            --input .github/workflows/ci.yml --input bun.lock --input package.json \
            --output "$spec" -- sh -eu -c 'bun install --frozen-lockfile; bun run typecheck; bun run test; bun run build:self; bun run build:odin; bun run build:lumbr'
          "$RUNNING_MAN_BIN" run --spec "$spec" --queue-timeout-seconds 90 \
            --receipt "$RUNNER_TEMP/running-man-root.receipt.json"
