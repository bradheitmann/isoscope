[package]
name = "isoscope-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
chrono = { version = "=0.4.45", features = ["serde"] }
fs2 = "=0.4.3"
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
tiny_http = "=0.12.0"
flate2 = "=1.1.10"

[dev-dependencies]
tempfile = "=3.27.0"
