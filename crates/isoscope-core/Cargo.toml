[package]
name = "isoscope-core"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
