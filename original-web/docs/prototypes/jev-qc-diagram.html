<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>How we catch drawing mistakes</title>
<style>
  body{margin:0;background:#f7f4ee;display:grid;place-items:center;min-height:100vh;font-family:ui-sans-serif,system-ui,sans-serif}
  svg{display:block;width:100vw;height:auto;max-height:100vh}
</style>
</head>
<body>
<svg viewBox="0 0 980 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7a7568"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cfc9b8;stroke-width:1.5}
      .good{fill:#eef5ec;stroke:#5a8a5a}
      .ai{fill:#f2edfa;stroke:#8a6ab0}
      .human{fill:#fdeee6;stroke:#b0724a}
      .t{font-size:17px;font-weight:700;fill:#2a2c30}
      .s{font-size:13px;fill:#5c5749}
      .sx{font-size:12px;fill:#6c675a;font-style:italic}
      .lbl{font-size:12px;font-weight:700;fill:#6c675a}
      .arrow{stroke:#7a7568;stroke-width:2;fill:none;marker-end:url(#arr)}
      .big{font-size:20px;font-weight:700;fill:#2a2c30}
      .analogy{font-size:12.5px;fill:#8a6ab0;font-style:italic}
    </style>
  </defs>

  <text x="40" y="50" class="big">How we catch drawing mistakes before you ever see them</text>
  <text x="40" y="78" class="s">The map draws lines connecting the parts of your system. Sometimes a line gets drawn badly. Two safety nets catch that first.</text>

  <!-- start -->
  <rect class="box" x="40" y="120" width="280" height="96" rx="12"/>
  <text x="60" y="152" class="t">The map draws a line</text>
  <text x="60" y="176" class="s">connecting two parts of your system</text>
  <text x="60" y="196" class="s">(a wire, a flow, a link)</text>

  <!-- rule checker -->
  <rect class="box good" x="380" y="110" width="300" height="140" rx="12"/>
  <text x="400" y="142" class="t">1 · The rule-checker</text>
  <text x="400" y="166" class="s">Like a spell-checker for line-drawing.</text>
  <text x="400" y="186" class="s">Instant, free, no AI. It catches clear mistakes:</text>
  <text x="400" y="206" class="s">a line that bends wrong, a bridge over nothing,</text>
  <text x="400" y="224" class="s">a line that crosses itself.</text>
  <text x="400" y="242" class="sx">Hard rules — always right, always on.</text>

  <!-- good outcome -->
  <rect class="box good" x="740" y="130" width="200" height="80" rx="12"/>
  <text x="760" y="162" class="t">Looks clean</text>
  <text x="760" y="184" class="s">It ships. You see a</text>
  <text x="760" y="202" class="s">tidy drawing.</text>

  <!-- ai reader -->
  <rect class="box ai" x="380" y="330" width="300" height="150" rx="12"/>
  <text x="400" y="362" class="t">2 · A careful second reader</text>
  <text x="400" y="384" class="analogy">(a small AI — the "second opinion")</text>
  <text x="400" y="406" class="s">If a drawing isn't obviously fine or broken,</text>
  <text x="400" y="424" class="s">this reads it. It can <tspan font-weight="700">only raise a flag</tspan> —</text>
  <text x="400" y="444" class="s">"this might be off." It can <tspan font-weight="700">never approve</tspan></text>
  <text x="400" y="462" class="s">or publish anything on its own.</text>

  <!-- human -->
  <rect class="box human" x="740" y="350" width="200" height="110" rx="12"/>
  <text x="760" y="382" class="t">A person decides</text>
  <text x="760" y="404" class="s">Anything the AI flags</text>
  <text x="760" y="422" class="s">goes to a human. You</text>
  <text x="760" y="440" class="s">always have final say.</text>

  <!-- fine path from ai -->
  <rect class="box good" x="380" y="540" width="300" height="70" rx="12"/>
  <text x="400" y="572" class="t">Reads fine → ships</text>
  <text x="400" y="592" class="s">No flag, nothing to decide.</text>

  <!-- safety note -->
  <rect class="box" x="40" y="560" width="280" height="120" rx="12"/>
  <text x="60" y="590" class="t">Kept on a leash</text>
  <text x="60" y="612" class="s">The AI runs free + offline by default.</text>
  <text x="60" y="632" class="s">Real (paid) checks are capped by a budget</text>
  <text x="60" y="650" class="s">and logged, so it can't run up a bill</text>
  <text x="60" y="668" class="s">or quietly retry after failing.</text>

  <!-- arrows -->
  <path class="arrow" d="M320 168 L 378 175"/>
  <path class="arrow" d="M680 150 L 738 165"/>
  <text x="694" y="146" class="lbl">obviously fine</text>
  <path class="arrow" d="M530 250 L 530 328"/>
  <text x="540" y="296" class="lbl">not sure either way</text>
  <path class="arrow" d="M680 390 L 738 400"/>
  <text x="688" y="384" class="lbl">might be off</text>
  <path class="arrow" d="M530 480 L 530 538"/>
  <text x="540" y="516" class="lbl">reads fine</text>
</svg>
</body>
</html>
