<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>How Jev QC fits the Isoscope pipeline</title>
<style>
  body{margin:0;background:#f5f2ea;display:grid;place-items:center;min-height:100vh;font-family:ui-sans-serif,system-ui,sans-serif}
  svg{display:block;width:100vw;height:auto;max-height:100vh}
</style>
</head>
<body>
<svg viewBox="0 0 980 820" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5a6270"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9c2b2;stroke-width:1.5;rx:10}
      .det{fill:#eef6ee;stroke:#4a7a4a}
      .jev{fill:#f3ecfb;stroke:#7a5aa0}
      .opt{fill:#eef2fb;stroke:#4a5a98}
      .gate{fill:#fbeeee;stroke:#b05a5a}
      .src{fill:#efede6;stroke:#8a8474}
      .t{font-size:15px;font-weight:700;fill:#26282c}
      .s{font-size:11.5px;fill:#5a6270}
      .sx{font-size:11px;fill:#5a6270;font-style:italic}
      .lbl{font-size:11px;font-weight:700;fill:#5a6270}
      .arrow{stroke:#5a6270;stroke-width:1.6;fill:none;marker-end:url(#arr)}
      .dash{stroke-dasharray:5 4}
      .hdr{font-size:13px;font-weight:700;letter-spacing:.04em}
    </style>
  </defs>

  <text x="40" y="44" class="hdr" fill="#26282c">HOW JEV QC FITS THE SYSTEM</text>
  <text x="40" y="66" class="s">Every layout the map renders (or the shuffle proposes) flows through two QC layers — deterministic facts first, then an advisory semantic pass.</text>

  <!-- source -->
  <rect class="box src" x="40" y="100" width="300" height="86" rx="10"/>
  <text x="56" y="128" class="t">Trigger</text>
  <text x="56" y="148" class="s">spec change · layout shuffle</text>
  <text x="56" y="166" class="s">CI · a developer · the shuffle button</text>

  <!-- router -->
  <rect class="box" x="400" y="100" width="300" height="86" rx="10"/>
  <text x="416" y="128" class="t">Isometric router</text>
  <text x="416" y="148" class="s">isoRouteAll(nodes, edges) — the circuit research</text>
  <text x="416" y="166" class="s">orthogonal routes, hops, lanes, risers</text>

  <!-- deterministic -->
  <rect class="box det" x="40" y="270" width="380" height="150" rx="10"/>
  <text x="56" y="298" class="t">1 · Deterministic edge-QC</text>
  <text x="56" y="318" class="s">edge-qc.ts — offline, fast, NO model</text>
  <text x="56" y="340" class="s">hard geometric facts, authoritative:</text>
  <text x="56" y="360" class="s">off-grid elbows · zero-length steps ·</text>
  <text x="56" y="378" class="s">self-crossings · unneeded bridges · shared runs</text>
  <text x="56" y="404" class="sx">these are facts, not opinions</text>

  <!-- clean path -->
  <rect class="box det" x="560" y="270" width="340" height="86" rx="10"/>
  <text x="576" y="298" class="t">Clean → ship / apply</text>
  <text x="576" y="318" class="s">zero structural defects: the layout is used as-is</text>
  <text x="576" y="336" class="s">(shuffle keeps the cleanest of N candidates)</text>

  <!-- jev -->
  <rect class="box jev" x="40" y="470" width="380" height="170" rx="10"/>
  <text x="56" y="498" class="t">2 · Jev semantic (ADVISORY)</text>
  <text x="56" y="518" class="s">qa-evidence-v1 · bounded system-one decision</text>
  <text x="56" y="540" class="s">reads the QC evidence, judges readability:</text>
  <text x="56" y="560" class="s">issue_candidate · insufficient_evidence · human_review</text>
  <text x="56" y="586" class="sx">NEVER accepts, passes, or releases a layout.</text>
  <text x="56" y="606" class="sx">Advisory only — it can flag, it cannot approve.</text>

  <!-- governance gate -->
  <rect class="box gate" x="560" y="470" width="340" height="170" rx="10"/>
  <text x="576" y="498" class="t">Live-call governance</text>
  <text x="576" y="520" class="s">fixture-first: offline + deterministic by default</text>
  <text x="576" y="540" class="s">live only when ALL hold:</text>
  <text x="576" y="560" class="s">· TYPESAFE_API_KEY (Doppler, never in config)</text>
  <text x="576" y="578" class="s">· JEV_LIVE_BUDGET declared (1000) + decremented</text>
  <text x="576" y="596" class="s">· hash-only durable ledger · no silent retries</text>
  <text x="576" y="622" class="sx">a failed dispatch is counted, never auto-retried</text>

  <!-- outcomes -->
  <rect class="box opt" x="400" y="700" width="300" height="86" rx="10"/>
  <text x="416" y="728" class="t">Outcome</text>
  <text x="416" y="748" class="s">cleanest layout ships · flags go to a human ·</text>
  <text x="416" y="766" class="s">the map only ever renders a QC'd board</text>

  <!-- arrows -->
  <path class="arrow" d="M340 143 L398 143"/>
  <path class="arrow" d="M550 186 L 260 268"/>
  <path class="arrow" d="M420 345 L 558 313"/>
  <path class="arrow" d="M230 420 L 230 468"/>
  <text x="442" y="322" class="lbl">clean</text>
  <text x="200" y="448" class="lbl">defects / ambiguous</text>
  <path class="arrow" d="M420 555 L 558 555"/>
  <text x="440" y="548" class="lbl">live only</text>
  <path class="arrow dash" d="M230 640 L 470 698"/>
  <path class="arrow" d="M730 640 L 620 698"/>
  <text x="300" y="688" class="lbl">advisory disposition</text>
</svg>
</body>
</html>
